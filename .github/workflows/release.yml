name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/windows-build.yml
  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download verified artifact from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Flow88Mastering-Windows-VST3 --dir release
      - name: Publish beta only after all required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/Flow88Mastering-Windows-VST3.zip --verify-tag --prerelease --title "Flow88 Master $GITHUB_REF_NAME" --notes-file docs/beta-release-notes.md
